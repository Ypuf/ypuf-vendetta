<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Realmoji</title>
    <style>
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: #000;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: Georgia, "Times New Roman", serif;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      h1 {
        font-size: clamp(2rem, 6vw, 4rem);
        font-weight: 400;
        margin: 0 0 1rem;
        letter-spacing: 0.01em;
      }
      p {
        font-size: clamp(1rem, 2.5vw, 1.25rem);
        margin: 0;
        max-width: 32rem;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Realmoji.</h1>
      <p>This plugin displays fake nitro emojis as real emojis.</p>
    </main>
  </body>
</html>
