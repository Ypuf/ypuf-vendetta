<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>FixMyEmojis</title>
    <style>
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html,
      body {
        min-height: 100%;
        margin: 0;
      }
      body {
        background: #000;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: Georgia, "Times New Roman", serif;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      h1 {
        font-size: clamp(2rem, 6vw, 4rem);
        font-weight: 400;
        margin: 0 0 1rem;
        letter-spacing: 0.01em;
      }
      p {
        font-size: clamp(1rem, 2.5vw, 1.25rem);
        margin: 0;
        max-width: 32rem;
        line-height: 1.6;
      }
      .examples {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
        gap: 1.5rem;
        margin-top: 1.5rem;
      }
      figure {
        margin: 0;
        max-width: 100%;
      }
      figure img {
        display: block;
        max-width: 100%;
        height: auto;
        border-radius: 0.5rem;
      }
      figcaption {
        margin-top: 0.5rem;
        font-size: 0.95rem;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>FixMyEmojis.</h1>
      <p>Emojis on Mobile have a horizontal gap when put onto new lines</p>
      <p>
        For example, if you have a 3x3 grid of emojis it will display like this:
      </p>
      <div class="examples">
        <figure>
          <img
            src="mobile.png"
            width="360"
            height="162"
            alt="A 3x3 emoji grid on mobile, with annoying gaps between each row"
          />
          <figcaption>Mobile</figcaption>
        </figure>
        <p>Desktop:</p>
        <figure>
          <img
            src="desktop.png"
            width="308"
            height="175"
            alt="The same 3x3 emoji grid on desktop, with no gaps between rows"
          />
          <figcaption>Desktop</figcaption>
        </figure>
      </div>
    </main>
  </body>
</html>
